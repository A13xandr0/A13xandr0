name: Build and deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - "*.md"
      - "**/*.md"
      - "mkdocs.yml"
      - "llms.txt"
      - "robots.txt"
      - "overrides/**"
      - "javascripts/**"
      - "CITATION.cff"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "*.md"
      - "**/*.md"
      - "mkdocs.yml"
      - "llms.txt"
      - "robots.txt"
      - "overrides/**"
      - "javascripts/**"
      - "CITATION.cff"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out canonical Markdown source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install documentation dependencies
        run: pip install "mkdocs-material[imaging]>=9.6,<10"
      - name: Assemble temporary documentation directory
        run: |
          mkdir -p docs
          cp README.md docs/index.md
          cp -R frameworks templates javascripts docs/
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/frameworks/README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('../README.md#principles', '../index.md#principles')
          p.write_text(text, encoding='utf-8')
          PY
          cp llms.txt robots.txt docs/
      - name: Build and validate documentation
        run: mkdocs build --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
