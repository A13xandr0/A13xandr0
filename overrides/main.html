{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% set page_description = page.meta.get('description', config.site_description) %}
  {% set reviewed = page.meta.get('last_reviewed', '2026-11-14') %}
  <meta name="author" content="Alexandro Sances">
  <meta name="keywords" content="{{ page.meta.get('keywords', 'technology strategy, governance, digital transformation') }}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ page.title }} | {{ config.site_name }}">
  <meta property="og:description" content="{{ page_description }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta name="twitter:card" content="summary">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "@id": "{{ config.site_url }}#author",
        "name": "Alexandro Sances",
        "url": "https://www.linkedin.com/in/alexandrosances/",
        "sameAs": [
          "https://github.com/A13xandr0",
          "https://www.linkedin.com/in/alexandrosances/"
        ],
        "knowsAbout": [
          "Technology strategy",
          "Technology governance",
          "Digital transformation",
          "Enterprise AI governance",
          "Retrieval-augmented generation",
          "Digital portfolio governance",
          "Open-source governance",
          "Digital infrastructure"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "{{ config.site_url }}#website",
        "url": "{{ config.site_url }}",
        "name": "{{ config.site_name }}",
        "description": "{{ config.site_description }}",
        "inLanguage": "en",
        "author": { "@id": "{{ config.site_url }}#author" }
      },
      {
        "@type": "TechArticle",
        "@id": "{{ page.canonical_url }}#article",
        "headline": {{ page.title | tojson }},
        "description": {{ page_description | tojson }},
        "url": {{ page.canonical_url | tojson }},
        "dateModified": {{ reviewed | tojson }},
        "inLanguage": "en",
        "author": { "@id": "{{ config.site_url }}#author" },
        "publisher": { "@id": "{{ config.site_url }}#author" },
        "isPartOf": { "@id": "{{ config.site_url }}#website" },
        "license": "https://creativecommons.org/licenses/by/4.0/"
      }
    ]
  }
  </script>
{% endblock %}
